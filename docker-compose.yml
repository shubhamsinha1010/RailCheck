services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      RAILCHECK_BACKEND: fake
      RAILCHECK_ALLOW_THRESHOLD: "0.85"
      RAILCHECK_BLOCK_THRESHOLD: "0.85"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5
